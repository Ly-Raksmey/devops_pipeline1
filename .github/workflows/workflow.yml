name: Building my first CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up node.js
        uses: actions/setup-node@v4
        with:
          version: lts/*

      - name: Install Dependencies
        run: npm install

      - name: Run Test
        run: npm test
